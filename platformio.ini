; PlatformIO Project Configuration File for Waveshare ESP32-S3-ePaper-1.54
;
; Board: Waveshare ESP32-S3-ePaper-1.54
; MCU: ESP32-S3 (Xtensa dual-core LX7, up to 240MHz)
; Memory: 512KB SRAM, 384KB ROM, with Flash and PSRAM
; Display: 1.54" e-Paper, 200x200 resolution
; Features: Wi-Fi, BLE, RTC (PCF85063), SHTC3 sensor, Audio codec, SD card
;
; Documentation: https://www.waveshare.com/wiki/ESP32-S3-ePaper-1.54

[platformio]
default_envs = waveshare_epaper_154 ; ESP32-S3-ePaper-1.54

[env:waveshare_epaper_154]
; Waveshare requires Arduino-ESP32 3.2.0 or newer. This pinned pioarduino
; release carries Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5.
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
;platform = espressif32
;platform = espressif32@^6.9.0
platform = espressif32 @ 7.0.0
board = esp32-s3-devkitc-1
framework = arduino

; Board configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB

; Partition scheme - use default 4MB with SPIFFS
; Adjust if your board has different flash size
;board_build.partitions = default.csv
board_build.partitions = default_8MB.csv

; Enable PSRAM (required for LVGL buffer allocation)
board_build.arduino.memory_type = qio_opi

; USB Configuration (ESP32-S3 native USB)
board_build.usb_mode = 1  ; Enable USB-OTG (hardware CDC/JTAG)
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
;monitor_filters = esp32_exception_decoder  ; decode error
monitor_filters = time  ; add timestamp to logs

board_build.filesystem = littlefs

;board_upload.use_1200bps_touch = yes
;board_upload.wait_for_upload_port = yes


build_flags =
	-std=gnu++17
	;-Wno-register

    ; PSRAM configuration
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

    ; ESP32-S3 specific
    -DESP32S3
	;-DCORE_DEBUG_LEVEL=5

	; Memory optimization
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DCONFIG_SPIRAM_USE_MALLOC

build_unflags =
    -std=gnu++11

lib_deps = 
	bblanchon/ArduinoJson @ ^7.4.3
	;h2zero/NimBLE-Arduino @ ^1.4.1
	;ricmoo/QRCode @ ^0.0.1
	zinggjm/GxEPD2@1.6.9
	lewisxhe/SensorLib@^0.4.0